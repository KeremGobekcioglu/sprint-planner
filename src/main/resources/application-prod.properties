# Production profile (SPRING_PROFILES_ACTIVE=prod). Layered on top of application.properties.

# The compose.yaml support is for local development only
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false

# Nobody becomes admin by signing up first; the admin is created from ADMIN_EMAIL / ADMIN_PASSWORD
app.first-user-is-admin=false

# Never leak exception messages / stack traces in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=INFO
logging.level.com.sprintplanner=INFO
