spring.application.name=sprint-planner
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:mydatabase}
spring.datasource.username=${PGUSER:user}
spring.datasource.password=${PGPASSWORD:1234}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
sprintplanner.memory.base-path=memory

spring.web.cors.allowed-origins=${CORS_ORIGIN}
app.cors.allowed-origins=${CORS_ORIGIN}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

gemini.api-key=${GEMINI_API_KEY}

trello.api-key=${TRELLO_API_KEY:}
trello.token=${TRELLO_TOKEN:}
trello.base-url=https://api.trello.com/1

# Multipart upload limits for context file extraction
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-minimum-32-characters-long-for-jwt}
jwt.expiration-ms=86400000
