spring.application.name=sprint-planner
spring.profiles.active=dev
spring.datasource.url=jdbc:postgresql://localhost:5433/mydatabase
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=user
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view= false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
sprintplanner.memory.base-path=memory

spring.web.cors.allowed-origins=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

gemini.api-key=${GEMINI_API_KEY}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-minimum-32-characters-long-for-jwt}
jwt.expiration-ms=86400000
