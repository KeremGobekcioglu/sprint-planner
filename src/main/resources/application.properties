spring.application.name=sprint-planner
spring.profiles.active=dev
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view= false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
sprintplanner.memory.base-path=memory

spring.web.cors.allowed-origins=${CORS_ORIGIN}
app.cors.allowed-origins=${CORS_ORIGIN}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

gemini.api-key=${GEMINI_API_KEY}

trello.api-key=${TRELLO_API_KEY:}
trello.token=${TRELLO_TOKEN:}
trello.base-url=https://api.trello.com/1

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-minimum-32-characters-long-for-jwt}
jwt.expiration-ms=86400000
