spring.application.name=sprint-planner
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:mydatabase}
spring.datasource.username=${PGUSER:user}
spring.datasource.password=${PGPASSWORD:1234}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
sprintplanner.memory.base-path=memory

spring.web.cors.allowed-origins=${CORS_ORIGIN}
app.cors.allowed-origins=${CORS_ORIGIN}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

gemini.api-key=${GEMINI_API_KEY}

trello.api-key=${TRELLO_API_KEY:}
trello.token=${TRELLO_TOKEN:}
trello.base-url=https://api.trello.com/1

# Multipart upload limits for context file extraction
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- Production-readiness knobs (safe defaults for local dev) ---
# Behind a reverse proxy (Caddy): trust X-Forwarded-* so request.getRemoteAddr() is the real client IP
server.forward-headers-strategy=native
server.shutdown=graceful

# Only the health endpoint is exposed, without details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Signup / admin
app.registration-enabled=${REGISTRATION_ENABLED:true}
app.first-user-is-admin=true
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Rate limits: login/register per IP per minute; AI "units" (a full plan = 4) per user / globally
app.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}
app.ai.per-user-hourly=${AI_PER_USER_HOURLY:16}
app.ai.per-user-daily=${AI_PER_USER_DAILY:40}
app.ai.global-daily=${AI_GLOBAL_DAILY:200}
